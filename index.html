<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HANSY Reservations</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5a0f1b">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HANSY">
<style>
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#fff;color:#5a0f1b;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
.l{width:60px;height:60px;border-radius:15px;background:#5a0f1b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;border-bottom:5px solid #e3141e;margin:0 auto 14px}
#m{font-size:14px;color:#80666b}
</style>
</head>
<body>
<div><div class="l">HRE</div><div id="m">Loading…</div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbzdqu883oVyK1W2CbLFWGGxgaD4lHpvf_b0l5LOH7Xz147Ft2VIUIptgdrVKqDIPHRw/exec";
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
function show(h){document.open();document.write(h);document.close()}
fetch(API+"?api=page",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
.then(function(h){try{localStorage.setItem("hre_page",h)}catch(e){}show(h)})
.catch(function(){var h=null;try{h=localStorage.getItem("hre_page")}catch(e){}
 if(h)show(h);else document.getElementById("m").textContent="No connection. Check your internet and open the app again.";});
</script>
</body>
</html>
